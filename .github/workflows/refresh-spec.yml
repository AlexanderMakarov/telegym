name: Refresh Bot API spec

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull latest spec
        run: |
          cp pkg/mock/spec/api.json "$RUNNER_TEMP/api.old.json"
          make refresh-spec

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet pkg/mock/spec/api.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(jq -r .version pkg/mock/spec/api.json)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Summarise changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          # shellcheck disable=SC2016 # backticks are literal Markdown
          {
            echo 'Auto-generated refresh of `pkg/mock/spec/api.json` from'
            echo '[PaulSonOfLars/telegram-bot-api-spec](https://github.com/PaulSonOfLars/telegram-bot-api-spec).'
            echo
            echo 'Methods without an explicit handler keep working: the generic dispatcher'
            echo 'answers them from this spec. Only the first list below may need a look.'
            echo
            scripts/spec-diff.sh "$RUNNER_TEMP/api.old.json" pkg/mock/spec/api.json
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        env:
          NEW_VERSION: ${{ steps.changes.outputs.version }}
        with:
          branch: chore/refresh-spec
          commit-message: "chore: refresh Bot API spec"
          title: "chore: refresh Bot API spec"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: |
            chore
            dependencies
